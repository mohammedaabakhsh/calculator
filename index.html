<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>حاسبة النسبة المئوية</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="حاسبة">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0a0a0f;
      min-height: 100vh;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .result-enter  { animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .partner-enter { animation: fadeIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .mode-btn  { transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1); }
    .mode-btn:active  { transform: scale(0.94); }
    .calc-btn  { transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1); }
    .calc-btn:active  { transform: scale(0.97); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        const SW_VER = 'v2';
        if (localStorage.getItem('swVer') !== SW_VER) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
          localStorage.setItem('swVer', SW_VER);
        }
        navigator.serviceWorker.register('/calculator/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
